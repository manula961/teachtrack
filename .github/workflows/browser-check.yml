name: Public browser and accessibility checks
on:
  push:
    branches: [audit-fixes-2026-10-28]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0 @axe-core/playwright@4.11.0
      - run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop public pages
        env:
          BASE_URL: https://teachtrack.devoraid.com
        run: node scripts/browser-public-check.mjs
