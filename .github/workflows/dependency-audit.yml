name: Dependency vulnerability details
on:
  push:
    branches: [audit-fixes-2026-10-28]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Summarize npm advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs=require('node:fs')
          const audit=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'))
          for(const [name,entry] of Object.entries(audit.vulnerabilities||{})){
            console.log(JSON.stringify({
              name, severity:entry.severity, isDirect:entry.isDirect,
              range:entry.range, fixAvailable:entry.fixAvailable,
              via:entry.via.map(v=>typeof v==='string'?v:{
                name:v.name,title:v.title,range:v.range,url:v.url
              })
            }))
          }
          console.log('SUMMARY',JSON.stringify(audit.metadata?.vulnerabilities))
          NODE
