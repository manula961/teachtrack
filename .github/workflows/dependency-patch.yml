name: Apply dependency security patches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-build-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Apply compatible security patches
        run: |
          npm ci
          # Next.js 15 permits PostCSS 8; override the vulnerable transitive range.
          # Avoid a breaking Next.js 16 upgrade until separately tested.
          npm pkg set 'overrides.postcss=^8.5.23'
          npm install
          npm audit fix
          npm audit --audit-level=moderate
          npm run check
          npm run build
      - name: Commit verified dependency updates to repair branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: patch audited npm dependency vulnerabilities"
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
          git push origin HEAD:audit-fixes-2026-10-28
